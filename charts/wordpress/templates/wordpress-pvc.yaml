#==============================================================================
# WORDPRESS CORE PERSISTENT VOLUME CLAIM
#==============================================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-core
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/component: application
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.wordpress.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.wordpress.persistence.coreSize }}

---

