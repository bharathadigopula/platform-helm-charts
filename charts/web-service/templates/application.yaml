#==============================================================================
# NON-ROOT APPLICATION WITH EXPLICIT RESOURCE AND HEALTH BOUNDS
#==============================================================================
{{ include "web.guard" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web.name" . }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, app.kubernetes.io/component: app}
  template:
    #==========================================================================
    # RELEASE-SCOPED POD IDENTITY
    #==========================================================================
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, app.kubernetes.io/component: app}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.registrySecret }}
      imagePullSecrets: [{name: {{ .Values.registrySecret | quote }}}]
      {{- end }}
      #========================================================================
      # NON-ROOT IDENTITY AND DEFAULT SECCOMP
      #========================================================================
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsGroup }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        #======================================================================
        # PINNED IMAGE AND RESTRICTED CONTAINER PRIVILEGES
        #======================================================================
        - name: app
          image: {{ .Values.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          #====================================================================
          # EXTERNAL ENVIRONMENT AND RESOURCE BUDGET
          #====================================================================
          envFrom: [{secretRef: {name: {{ .Values.runtimeSecret | quote }}}}]
          ports: [{name: http, containerPort: {{ .Values.port }}}]
          resources: {{ .Values.resources | toYaml | nindent 12 }}
          #====================================================================
          # STARTUP, READINESS AND PROCESS LIVENESS
          #====================================================================
          startupProbe:
            httpGet: {path: {{ .Values.readinessPath | quote }}, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: {{ .Values.readinessPath | quote }}, port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
          #====================================================================
          # BOUNDED WRITABLE SCRATCH SPACE
          #====================================================================
          volumeMounts: [{name: temporary, mountPath: /tmp}]
      volumes: [{name: temporary, emptyDir: {sizeLimit: 64Mi}}]
---
#==============================================================================
# INTERNAL APPLICATION SERVICE
#==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "web.name" . }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, app.kubernetes.io/component: app}
  ports: [{name: http, port: {{ .Values.port }}, targetPort: http}]
{{ if .Values.ingress.enabled }}
---
#==============================================================================
# OPTIONAL INGRESS - TLS MAY TERMINATE AT A PRIVATE EDGE CONNECTOR
#==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "web.name" . }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  #============================================================================
  # OPTIONAL IN-CLUSTER TLS TERMINATION
  #============================================================================
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ .Values.ingress.hostname | quote }}]
      secretName: {{ .Values.ingress.tlsSecret | quote }}
  {{- end }}
  #============================================================================
  # EXPLICIT HOST ROUTING TO THE INTERNAL SERVICE
  #============================================================================
  rules:
    - host: {{ .Values.ingress.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "web.name" . }}
                port: {name: http}
{{ end }}