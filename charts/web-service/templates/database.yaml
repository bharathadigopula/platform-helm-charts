#==============================================================================
# OPTIONAL POSTGRESQL WITH RETAINED VOLUME CLAIMS
#==============================================================================
{{ if .Values.database.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "web.name" . }}-postgres
spec:
  clusterIP: None
  selector: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, app.kubernetes.io/component: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "web.name" . }}-postgres
spec:
  serviceName: {{ include "web.name" . }}-postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, app.kubernetes.io/component: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}, app.kubernetes.io/component: postgres}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      {{- if .Values.registrySecret }}
      imagePullSecrets: [{name: {{ .Values.registrySecret | quote }}}]
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.database.runAsUser }}
        runAsGroup: {{ .Values.database.runAsGroup }}
        fsGroup: {{ .Values.database.runAsGroup }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.database.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          envFrom: [{secretRef: {name: {{ .Values.database.existingSecret | quote }}}}]
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_DB, value: {{ .Values.database.name | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.database.username | quote }}}
          ports: [{name: postgres, containerPort: 5432}]
          resources: {{ .Values.database.resources | toYaml | nindent 12 }}
          startupProbe:
            exec: {command: [pg_isready, -U, {{ .Values.database.username | quote }}, -d, {{ .Values.database.name | quote }}]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -U, {{ .Values.database.username | quote }}, -d, {{ .Values.database.name | quote }}]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -U, {{ .Values.database.username | quote }}, -d, {{ .Values.database.name | quote }}]}
            periodSeconds: 20
          volumeMounts:
            - {name: pgdata, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
        - {name: temporary, emptyDir: {sizeLimit: 64Mi}}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        annotations: {helm.sh/resource-policy: keep}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.database.storageClass | quote }}
        resources:
          requests: {storage: {{ .Values.database.storage | quote }}}
{{ end }}